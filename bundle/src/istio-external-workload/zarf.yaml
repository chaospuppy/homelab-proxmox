kind: ZarfPackageConfig
metadata:
  name: istio-external-workload
  description: "Custom gateway for exposing istiod and adding external workloads to the istio service mesh"
  version: "0.0.1"
  architecture: amd64
components:
  - name: external-workloads
    required: true
    charts:
      - name: istio-external-workloads
        namespace: istio-system
        version: 0.1.0
        localPath: ./chart/
        valuesFiles:
          - ./values/external-workload-values.yaml
  - name: istiod-gateway
    required: true
    charts:
      - name: gateway
        url: https://istio-release.storage.googleapis.com/charts
        version: 1.29.1
        releaseName: istiod-gateway
        namespace: istio-system
        valuesFiles:
          - ./values/istio-gateway-values.yaml
