workloadGroups:
  fleeting-runners:
    namespace: fleeting-runners
    # namespaceLabels:
    #   istio.io/dataplane-mode: ambient
    network: vm-network
    labels: {}
    serviceAccount: "default"

ipAddressPools:
  istiod-gateway:
    namespace: metallb-system
    ipAddresses:
      - 192.168.2.21/32
    serviceAllocation:
      namespaces:
        - istio-system
      priority: 50
      serviceSelectors:
        - matchLabels:
            app: istiod-gateway
  istio-eastwestgateway:
    namespace: metallb-system
    ipAddresses:
      - 192.168.2.30/32
    serviceAllocation:
      namespaces:
        - istio-system
      priority: 50
      serviceSelectors:
        - matchLabels:
            app: istio-eastwestgateway

l2Advertisements:
  istiod-gateway:
    namespace: metallb-system
    interfaces:
      - ens18
    ipAddressPools:
      - istiod-gateway
  istio-eastwestgateway:
    namespace: metallb-system
    interfaces:
      - ens18
    ipAddressPools:
      - istio-eastwestgateway

virtualService:
  enabled: true
  namespace: istio-system
  gateways:
    - istio-system/istiod-gateway
  istiodPort: 15012
  webhook:
    gatewayPort: 15017
    servicePort: 443

gateway:
  enabled: true
  name: istiod-gateway
  namespace: istio-system
  labels:
    topology.istio.io/network: "kube-network"
  selector:
    app: istiod-gateway
  servers:
    - hosts:
        - "istiod.istio-system.svc"
      port:
        name: webhook
        number: 15017
        protocol: TLS
      tls:
        mode: PASSTHROUGH
    - hosts:
        - "istiod.istio-system.svc"
      port:
        name: istiod
        number: 15012
        protocol: TLS
      tls:
        mode: PASSTHROUGH
    - hosts:
        - "*.svc.cluster.local"
        - "*.svc.cluster"
        - "*.svc"
      port:
        name: tls
        number: 15443
        protocol: TLS
      tls:
        mode: AUTO_PASSTHROUGH

gatewayv2:
  enabled: false
  gateways:
    - name: istio-eastwestgateway
      namespace: istio-system
      gatewayclass: "istio-east-west"
      labels:
        topology.istio.io/network: "kube-network"
        app: istio-eastwestgateway
      listeners:
        - name: mesh
          port: 15008
          protocol: HBONE
          tls:
            mode: Terminate
            options:
              gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
              # - name: istiod-gateway
              #   namespace: istio-system
              #   gatewayclass: "istio"
              #   labels:
              #     app: istiod-gateway
              #   listeners:
              #     - name: istiod
              #       hostname: "istiod.istio-system.svc"
              #       port: 15012
              #       protocol: TLS
              #       tls:
              #         mode: Passthrough
              #         # options:
              #         #   gateway.istio.io/tls-terminate-mode: PASSTHROUGH
              #       allowedRoutes:
              #         kinds:
              #           - kind: TLSRoute
              #         namespaces:
              #           from: All

tlsRoute:
  enabled: false
  name: "istiod"
  namespace: "istio-system"
  parentRefs:
    - name: istiod-gateway
  hostnames:
    - "istiod.istio-system.svc"
  rules:
    - backendRefs:
        - port: 15012
          name: istiod
          namespace: istio-system
